        .brand-shadow { box-shadow: 0 4px 14px 0 rgba(183, 148, 244, 0.39); }
        .marquee {
            white-space: nowrap;
            overflow: hidden;

        }
        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
